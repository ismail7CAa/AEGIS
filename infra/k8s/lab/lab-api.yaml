apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: aegis-lab
  labels:
    app: lab-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: lab-api

  template:
    metadata:
      labels:
        app: lab-api

    spec:
      containers:
        - name: lab-api
          image: aegis-lab-api:dev
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
  namespace: aegis-lab

spec: 
  selector:
    app: lab-api

  ports:
    - port: 80
      targetPort: 8000
